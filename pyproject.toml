[project]
name = "pomodoro-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "redis (>=8.1.0,<9.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "response (>=0.5.0,<0.6.0)",
    "requests (>=2.34.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "twisted (>=26.4.0,<27.0.0)",
]

[tool.poetry]
packages = [{include = "pomodoro_poetry", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "faker (>=40.38.0,<41.0.0)",
    "pytest-factoryboy (>=2.8.1,<3.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
